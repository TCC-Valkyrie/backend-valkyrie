services:
  video-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      FFMPEG_PATH: ffmpeg
      AWS_REGION: us-east-1
      AWS_S3_BUCKET_RAW: CRIAR_ENV
      AWS_S3_BUCKET_TRUSTED: CRIAR_ENV
      AWS_S3_BUCKET_CLIENT: CRIAR_ENV
      SPRING_DATASOURCE_URL: jdbc:mysql://crime-mysql:3306/crime_db
      SPRING_DATASOURCE_USERNAME: crime_user
      SPRING_DATASOURCE_PASSWORD: crime_password
      MODELO_URL: CRIAR_ENV
      MODELO_MOCK: false
      AWS_ACCESS_KEY_ID: CRIAR_ENV
      AWS_SECRET_ACCESS_KEY: CRIAR_ENV
      AWS_SESSION_TOKEN: CRIAR_ENV
    networks:
      - crime-network

networks:
  crime-network:
    external: true
